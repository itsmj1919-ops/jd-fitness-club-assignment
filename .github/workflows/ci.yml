name: JD Fitness Club CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate assignment and main site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify plain assignment app
        run: pnpm verify:assignment

      - name: Start app shell for endpoint tests
        run: |
          pnpm dev > /tmp/jd-fitness-dev.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jd-fitness-dev.log
          exit 1

      - name: Run project tests
        run: pnpm test

      - name: Type-check project
        run: pnpm check

      - name: Build project
        run: pnpm build
